name: Build GTK themes

on:
  push:
    branches:
      - main
      - dev*
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y sassc wget p7zip-full

      - name: Install oxipng
        run: |
          OXIPNG_VER=10.2.1
          OXIPNG_SHA256=1813750ef592c5350ca79c88f98b2c0876d05c826dc7156245256d4255c1ad17
          curl -fsSL "https://github.com/oxipng/oxipng/releases/download/v${OXIPNG_VER}/oxipng-${OXIPNG_VER}-x86_64-unknown-linux-musl.tar.gz" -o oxipng.tar.gz
          echo "${OXIPNG_SHA256}  oxipng.tar.gz" | sha256sum -c -
          tar -xzf oxipng.tar.gz
          sudo install -m 0755 "oxipng-${OXIPNG_VER}-x86_64-unknown-linux-musl/oxipng" /usr/local/bin/oxipng
          oxipng --version

      - name: Install svgo
        # Ignore scripts to avoid potential security issues.
        run: npm install -g --ignore-scripts svgo@3.3.4 && svgo --version

      - name: Build GTK themes
        run: bash make_gtk_theme.sh

      - name: Upload themes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gtk-themes
          path: gtk-themes.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: gtk-themes.zip
          generate_release_notes: true
