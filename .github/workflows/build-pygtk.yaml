name: Build and Package PyGTK

on:
  push:
    branches:
      - 'main'
      - 'dev*'
      - '!dependabot/**' # avoid duplicate runs; the pull_request event handles dependabot PRs
    tags:
      - 'v*'
    paths-ignore: &paths-ignore
      - '.github/dependabot.yml'
      - '.github/workflows/build-gtk-themes.yaml'
      - '.github/workflows/cleanup-caches.yml'
      - '.github/workflows/zizmor.yml'
      - '.gitattributes'
      - '.gitignore'
      - '.shellcheckrc'
      - 'install-theme-tools.sh'
      - 'LICENSE'
      - 'make_gtk_theme.sh'
      - 'package-lock.json'
      - 'package.json'
      - 'README.md'
  pull_request:
    paths-ignore: *paths-ignore
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
  GTK_VERSION: 3.24

jobs:
  vcpkg-build:
    name: Build python and PyGTK (${{ matrix.triplet }})
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read
      # OIDC token for Azure login (Artifact Signing)
      id-token: write
    strategy:
      # A cancelled matrix job would not save its vcpkg cache
      fail-fast: false
      matrix:
        include:
          - triplet: x86-windows
          - triplet: x64-windows

    env:
      VCPKG_COMMIT: '7ece2c79b95131924820fb67c977abb3c4602724'
      VCPKG_TRIPLET: ${{ matrix.triplet }}
      # gobject-introspection runs the built binaries, so host = target
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.triplet }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: vcpkg
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python requirements
        shell: bash
        run: |
          python -m pip install --no-deps -r requirements-vcpkg.txt
          python -m pip check

      - name: Test the GIR filter
        shell: bash
        run: python -m unittest gir/test_filter_glib_gir.py

      - name: Set up pygtkwin environment
        uses: $/actions/pygtkwin-env

      - name: Prepare vcpkg
        id: vcpkg-prepare
        shell: pwsh
        run: ./build-vcpkg.ps1 -Triplet $env:VCPKG_TRIPLET -Phase Prepare

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        # Skipped for tags: vcpkg trusts archives by their names, so a poisoned
        # cache could reach a release.
        if: github.ref_type != 'tag'
        # zizmor: ignore[cache-poisoning] releases build with a cold cache, see above
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/vcpkg/archives
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-${{ steps.vcpkg-prepare.outputs.abi-hash }}
          # When the ABIs changed, start from the newest cache for this triplet
          restore-keys: ${{ runner.os }}-vcpkg-${{ matrix.triplet }}-

      - name: vcpkg build
        shell: pwsh
        run: ./build-vcpkg.ps1 -Triplet $env:VCPKG_TRIPLET -Phase Install -PruneCache

      - name: Save vcpkg binary cache
        if: github.ref_type != 'tag' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/vcpkg/archives
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Generate platform-specific typelibs
        shell: bash
        run: |
          ./generate-platform-typelibs.sh "vcpkg/installed/$VCPKG_TRIPLET"

      - name: Validate build
        shell: bash
        run: |
          ./validate-build.sh "vcpkg/installed/$VCPKG_TRIPLET"

      # PRs skip signing: forked PRs cannot reach the federated credential, and
      # unreviewed code should never receive the signature.
      # vcpkg copies identical DLLs into many tools/ dirs; signing one copy per
      # unique content hash and copying it back saves ~half the signing calls.
      - name: Deduplicate files for signing
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $root = "vcpkg\installed\$env:VCPKG_TRIPLET"
          $pes = Get-ChildItem -Recurse -Path $root -Include *.exe,*.dll,*.pyd
          $groups = $pes | Group-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash }
          $map = [ordered]@{}
          foreach ($g in $groups) {
            $paths = @($g.Group | ForEach-Object { $_.FullName.Substring((Get-Location).Path.Length + 1) })
            $map[$paths[0]] = @($paths | Select-Object -Skip 1)
          }
          $map | ConvertTo-Json -Depth 2 | Set-Content sign-map.json
          ($map.Keys | ForEach-Object { "./$($_ -replace '\\','/')" }) | Set-Content sign-catalog.txt
          Write-Host "Files: $($pes.Count), unique: $($map.Count)"

      - name: Azure login
        if: github.event_name != 'pull_request'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign binaries with Azure Artifact Signing
        if: github.event_name != 'pull_request'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: bleachbitcodesign
          certificate-profile-name: AndrewProfile
          files-catalog: ${{ github.workspace }}\sign-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Copy signatures to duplicate files
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $map = Get-Content sign-map.json | ConvertFrom-Json
          foreach ($p in $map.PSObject.Properties) {
            foreach ($dup in $p.Value) { Copy-Item $p.Name $dup }
          }

      - name: Verify signatures
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $bad = Get-ChildItem -Recurse -Path "vcpkg\installed\$env:VCPKG_TRIPLET" -Include *.exe,*.dll,*.pyd |
            Get-AuthenticodeSignature | Where-Object Status -ne 'Valid'
          if ($bad) {
            $bad | ForEach-Object { Write-Warning "$($_.Status): $($_.Path)" }
            throw "Files without a valid signature remain"
          }

      - name: Package the build
        shell: pwsh
        env:
          # 5 is 7z's default; releases get the smallest archive
          COMPRESSION_LEVEL: ${{ github.ref_type == 'tag' && '9' || '5' }}
        run: ./package-build.ps1 -Triplet $env:VCPKG_TRIPLET -Archive "$env:GTK_BUILD_NAME.7z" -Level $env:COMPRESSION_LEVEL

      - name: Test the build
        shell: pwsh
        # pip is not installed
        run: |
          # Otherwise only the last command's exit code fails the step
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:PYTHON -V
          & $env:PYTHON test_python.py
          & $env:PYTHON show_versions.py --dll-directory "$env:VCPKG_DIR\bin"

      - name: Smoke test HTTPS (TLS 1.2/1.3)
        shell: pwsh
        run: |
          $env:PATH = "$env:VCPKG_DIR\bin;$env:PATH"
          & $env:PYTHON test_https.py --dll-directory "$env:VCPKG_DIR\bin"
          if ($LASTEXITCODE -ne 0) { throw "HTTPS smoke test failed" }

      - name: Upload the build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.GTK_BUILD_NAME }}.7z
          # Already compressed; the artifact is named after the file
          archive: false
          if-no-files-found: error

  pygobject-build:
    name: Build pygobject (${{ matrix.triplet }})
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # OIDC token for Azure login (Artifact Signing)
      id-token: write
    needs: vcpkg-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - triplet: x86-windows
            wheel: win32
          - triplet: x64-windows
            wheel: win_amd64

    env:
      VCPKG_TRIPLET: ${{ matrix.triplet }}
      PYGOBJECT_VERSION: 3.58.0
      PYGOBJECT_SHA256: 45068697de3ffe46840ca369705f23118b34db4f7deb63f6eff079a6734ddcca

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pygtkwin environment
        uses: $/actions/pygtkwin-env

      - name: Download PyGTK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.GTK_BUILD_NAME }}.7z

      - name: Extract PyGTK files
        shell: bash
        run: |
          sha256sum "$GTK_BUILD_NAME.7z"
          7z x -bso0 -bsp0 "$GTK_BUILD_NAME.7z"

      - name: Build wheel
        shell: pwsh
        env:
          WHEEL_TAG: ${{ matrix.wheel }}
        run: ./build-pygobject.ps1 -WheelTag $env:WHEEL_TAG

      - name: Test wheel
        shell: pwsh
        run: ./test-pygobject.ps1 -Wheel $env:PYGOBJECT_WHL

      # The wheel is a zip, so its .pyd files are signed by unpacking,
      # signing, and repacking; wheel pack regenerates RECORD with new hashes.
      - name: Azure login
        if: github.event_name != 'pull_request'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Extract wheel for signing
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          python -m pip install wheel
          python -m wheel unpack "$env:PYGOBJECT_WHL" -d wheel-signed

      - name: Sign wheel contents with Azure Artifact Signing
        if: github.event_name != 'pull_request'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: bleachbitcodesign
          certificate-profile-name: AndrewProfile
          files-folder: ${{ github.workspace }}\wheel-signed
          files-folder-filter: exe,dll,pyd
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Repack signed wheel
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $dir = Get-ChildItem wheel-signed -Directory | Select-Object -First 1
          python -m wheel pack $dir.FullName --dest-dir (Split-Path $env:PYGOBJECT_WHL -Parent)

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.PYGOBJECT_WHL }}
          # A wheel is already a zip; the artifact is named after the file
          archive: false
          if-no-files-found: error

  # One job creates the release, so parallel jobs don't race to create it
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [vcpkg-build, pygobject-build]
    permissions:
      contents: write # create the release and upload its files

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: ./create-release.sh "$TAG" gtk*.7z pygobject-*.whl
